[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-osu"
version = "1.0.0"
description = "Lyra: a jointly trained audio-to-osu!standard mapper"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.8.0", "numpy==2.2.6", "scipy==1.15.3", "imageio-ffmpeg==0.6.0",
  "rosu-pp-py==3.1.0", "filelock==3.32.3", "psutil==7.0.0", "threadpoolctl==3.6.0",
  "fastapi==0.141.1", "uvicorn==0.53.0", "python-multipart==0.0.32"
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx>=0.28,<0.29", "ruff==0.16.8"]

[project.scripts]
lyra = "lyra.__main__:main"

[tool.setuptools.packages.find]
include = ["lyra*"]

[tool.setuptools.package-data]
lyra = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F"]
